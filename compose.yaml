services:
  mysql:
    image: 'mysql:8'
    environment:
      - 'MYSQL_DATABASE=guildbanker'
      - 'MYSQL_PASSWORD=ChangeMe'
      - 'MYSQL_ROOT_PASSWORD=false'
      - 'MYSQL_USER=guildbanker'
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
